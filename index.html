<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noon SLP - Access System</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <style>
    :root {
      --bg-dark: #1e2025;
      --card-bg: #12151c;
      --border-color: #242b3b;
      --noon-yellow: #ffc700;
      --text-main: #f0f2f5;
      --text-muted: #8b95a5;
      --input-bg: #090b10;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    /* Perfect match to your image_cdcc99.png solid gradient background */
    body { 
      background: radial-gradient(circle at center, #2e3239 0%, #15171a 100%);
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      overflow-x: hidden; 
    }
    
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mb-4 { margin-bottom: 16px; }

    .login-container { width: 100%; max-width: 420px; background-color: var(--card-bg); padding: 40px 30px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
    .logo-box { width: 90px; height: 90px; margin: 0 auto 30px; background-color: var(--noon-yellow); border-radius: 12px; }
    
    .role-tabs { display: flex; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; margin-bottom: 24px; background: #0b0e14; }
    .role-tab { flex: 1; padding: 12px 0; text-align: center; font-size: 11px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-right: 1px solid var(--border-color); text-transform: uppercase; }
    .role-tab.active { background: var(--noon-yellow); color: #000; }
    
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .input-field { width: 100%; padding: 14px; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: white; outline: none; font-size: 14px; }
    .input-field:focus { border-color: var(--noon-yellow); }
    .file-input { padding: 10px; background: var(--input-bg); border: 1px dashed var(--border-color); width: 100%; color: var(--text-muted); font-size: 12px; }
    
    .btn-primary { width: 100%; padding: 14px; background-color: var(--noon-yellow); color: #000; font-weight: 700; font-size: 14px; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
    .btn-outline { background: transparent; color: var(--noon-yellow); border: 1px solid var(--noon-yellow); }
    .btn-success { background: var(--success); color: white; border: none; }
    
    .dashboard { width: 100%; max-width: 800px; padding: 20px; margin-top: 40px; align-self: flex-start; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
    .header h2 { color: var(--noon-yellow); font-size: 20px; }
    
    .ops-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .ops-card { background: var(--card-bg); padding: 24px; border-radius: 8px; border: 1px solid var(--border-color); }
    
    #qr-container { background: white; padding: 15px; border-radius: 8px; display: inline-block; margin: 15px 0; }
    #reader { width: 100%; border: 2px solid var(--border-color); border-radius: 8px; overflow: hidden; background: #000; }
    
    /* Gate Scanner Flashing Colors */
    .scan-result-card { padding: 30px; border-radius: 8px; text-align: center; margin-top: 20px; color: white; font-weight: bold; }
    .bg-green { background-color: var(--success); }
    .bg-red { background-color: var(--danger); }
  </style>
</head>
<body>

  <!-- ================= 1. LOGIN SCREEN ================= -->
  <div id="login-view" class="login-container">
    <div class="logo-box"></div>
    <div class="role-tabs">
      <div class="role-tab" id="tab-guard" onclick="switchLoginTab('guard')">🛡️ Guard</div>
      <div class="role-tab active" id="tab-ops" onclick="switchLoginTab('ops')">📋 Visitor/Ops</div>
      <div class="role-tab" id="tab-admin" onclick="switchLoginTab('admin')">⚙️ Admin</div>
    </div>

    <div id="login-guard" class="hidden">
      <div class="input-group"><input type="text" id="lg-name" class="input-field" placeholder="Name"></div>
      <div class="input-group"><input type="text" id="lg-id" class="input-field" placeholder="Noon ID"></div>
      <div class="input-group">
        <select id="lg-location" class="input-field">
          <option value="">Select Guard Location...</option>
          <option value="RUH01">RUH01</option>
          <option value="JED01">JED01</option>
          <option value="DXB01">DXB01</option>
        </select>
      </div>
      <button class="btn-primary" onclick="login('guard')">LOGIN TO GATE</button>
    </div>

    <div id="login-ops">
      <div class="input-group"><input type="text" id="lo-name" class="input-field" placeholder="Host Name"></div>
      <div class="input-group"><input type="email" id="lo-mail" class="input-field" placeholder="Host Mail"></div>
      <button class="btn-primary" onclick="login('ops')">LOGIN TO PORTAL</button>
    </div>

    <div id="login-admin" class="hidden">
      <div class="input-group"><input type="password" id="la-pass" class="input-field" placeholder="Password"></div>
      <button class="btn-primary" onclick="login('admin')">LOGIN AS ADMIN</button>
    </div>
  </div>

  <!-- ================= 2. VISITOR / OPS DASHBOARD ================= -->
  <div id="dashboard-ops" class="dashboard hidden">
    <div class="header">
      <h2>Visitor & Contractor Portal</h2>
      <button class="btn-primary btn-outline" style="width: auto; padding: 6px 12px;" onclick="logout()">Logout</button>
    </div>
    
    <div class="ops-grid">
      <!-- Registration Form -->
      <div class="ops-card">
        <h3 style="margin-bottom: 16px; color: var(--noon-yellow);">Register Guest</h3>
        <div class="input-group"><input type="text" id="req-vname" class="input-field" placeholder="Guest Full Name"></div>
        <div class="input-group">
          <select id="req-location" class="input-field">
            <option value="RUH01">Facility: RUH01</option>
            <option value="JED01">Facility: JED01</option>
            <option value="DXB01">Facility: DXB01</option>
          </select>
        </div>
        <div class="input-group">
          <select id="req-type" class="input-field" onchange="toggleDateFields()">
            <option value="Visitor">Type: Visitor</option>
            <option value="Contractor">Type: Contractor</option>
          </select>
        </div>
        
        <div class="input-group" id="date-visitor">
          <label>Visit Date</label>
          <input type="date" id="req-date-single" class="input-field">
        </div>
        <div class="input-group hidden" id="date-contractor">
          <label>Contract Expiration (From - To)</label>
          <div style="display: flex; gap: 10px;">
            <input type="date" id="req-date-start" class="input-field">
            <input type="date" id="req-date-end" class="input-field">
          </div>
        </div>

        <div class="input-group">
          <label>Upload ID Copy</label>
          <input type="file" class="file-input" accept="image/*">
        </div>
        <div class="input-group">
          <label>Upload Face Photo</label>
          <input type="file" class="file-input" accept="image/*" capture="user">
        </div>

        <button class="btn-primary" id="btn-submit-req" onclick="submitRequest()">Generate Pass</button>
      </div>

      <!-- Portal Status Checker -->
      <div class="ops-card text-center">
        <h3 style="margin-bottom: 16px; color: var(--noon-yellow);">Guest Pass / QR</h3>
        <div class="input-group"><input type="text" id="check-id" class="input-field" placeholder="Enter NOON-XXXXXX ID"></div>
        <button class="btn-primary btn-outline" onclick="checkStatus()">Get QR Code</button>
        
        <div id="status-display-area" class="hidden" style="margin-top: 20px;">
            <div id="qr-container"></div>
            <p id="v-id-display" style="font-size: 16px; font-weight: bold; color: var(--noon-yellow);"></p>
            <p id="v-status-msg" style="font-size: 12px; margin-top: 5px;"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= 3. GUARD DASHBOARD ================= -->
  <div id="dashboard-guard" class="dashboard hidden text-center">
    <div class="header">
      <h2>Gate Scanner (<span id="guard-loc-display"></span>)</h2>
      <button class="btn-primary btn-outline" style="width: auto; padding: 6px 12px;" onclick="logout()">Logout</button>
    </div>
    
    <div style="max-width: 400px; margin: 0 auto;">
      <button class="btn-primary mb-4" id="btn-start-scan" onclick="startScanner()">SCAN QR CODE</button>
      <div id="reader" class="hidden"></div>
      
      <div id="scan-result" class="scan-result-card hidden">
        <h1 id="r-decision" style="font-size: 32px; margin-bottom: 10px;">-</h1>
        <p id="r-reason" style="font-size: 14px; margin-bottom: 15px;"></p>
        <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; text-align: left; font-size: 14px;">
            <p><strong>Name:</strong> <span id="r-name">-</span></p>
            <p><strong>Type:</strong> <span id="r-type">-</span></p>
            <p><strong>Location:</strong> <span id="r-location">-</span></p>
        </div>
        <button id="btn-confirm-entry" class="btn-primary btn-success hidden" style="margin-top: 20px;" onclick="confirmEntry()">CONFIRM ENTRY</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ REPLACE THIS WITH YOUR NEW APPS SCRIPT URL
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzFQCv1Ng_n-U13NiMLz1Z2ldPzore4YBlnc6Iu4w5kkOSzaoNkPz80QlbD7PDOwld1_A/exec';
    
    let html5QrcodeScanner = null;
    let currentUser = null; 
    let currentScannedID = null;

    function switchLoginTab(role) {
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('#login-guard, #login-ops, #login-admin').forEach(f => f.classList.add('hidden'));
      document.getElementById(`tab-${role}`).classList.add('active');
      document.getElementById(`login-${role}`).classList.remove('hidden');
    }

    function login(role) {
      if (role === 'guard') {
        const loc = document.getElementById('lg-location').value;
        if(!loc) return alert("Select Guard Location");
        currentUser = { role: 'guard', location: loc };
        document.getElementById('guard-loc-display').innerText = loc;
        showDashboard('dashboard-guard');
      } 
      else if (role === 'ops') {
        const name = document.getElementById('lo-name').value;
        if(!name) return alert("Enter Host Name");
        currentUser = { role: 'ops', name: name };
        showDashboard('dashboard-ops');
      } 
    }

    function showDashboard(dashId) {
      document.getElementById('login-view').classList.add('hidden');
      document.querySelectorAll('.dashboard').forEach(el => el.classList.add('hidden'));
      document.getElementById(dashId).classList.remove('hidden');
    }

    function logout() {
      if(html5QrcodeScanner) html5QrcodeScanner.clear();
      location.reload(); 
    }

    // --- Ops Logic ---
    function toggleDateFields() {
      const type = document.getElementById('req-type').value;
      document.getElementById('date-visitor').classList.toggle('hidden', type === 'Contractor');
      document.getElementById('date-contractor').classList.toggle('hidden', type === 'Visitor');
    }

    async function submitRequest() {
      const type = document.getElementById('req-type').value;
      const payload = {
        action: 'create',
        hostName: currentUser.name,
        visitorName: document.getElementById('req-vname').value,
        type: type,
        location: document.getElementById('req-location').value,
        startDate: type === 'Visitor' ? document.getElementById('req-date-single').value : document.getElementById('req-date-start').value,
        endDate: type === 'Visitor' ? document.getElementById('req-date-single').value : document.getElementById('req-date-end').value
      };
      
      if(!payload.visitorName || !payload.startDate) return alert("Fill required fields");

      document.getElementById('btn-submit-req').innerText = 'Processing...';
      
      try {
        const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();
        alert(`Pass Generated! ID: ${data.id}`);
        document.getElementById('check-id').value = data.id; 
        document.getElementById('btn-submit-req').innerText = 'Generate Pass';
      } catch (err) { alert("Error"); }
    }

    async function checkStatus() {
      const id = document.getElementById('check-id').value.trim();
      const qrBox = document.getElementById('qr-container');
      document.getElementById('status-display-area').classList.remove('hidden');
      qrBox.innerHTML = ''; 
      
      try {
        const res = await fetch(`${SCRIPT_URL}?action=get_single&id=${id}`);
        const data = await res.json();
        if (data.error) return document.getElementById('v-status-msg').innerText = "Not found.";
        
        document.getElementById('v-id-display').innerText = data.UniqueID;
        document.getElementById('v-status-msg').innerText = `${data.Type} Pass - ${data.Location}`;
        new QRCode(qrBox, { text: data.UniqueID, width: 160, height: 160, colorDark: "#000", colorLight: "#fff" });
      } catch (err) {}
    }

    // --- Guard Scanner Logic ---
    function startScanner() {
      document.getElementById('btn-start-scan').classList.add('hidden');
      document.getElementById('reader').classList.remove('hidden');
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      html5QrcodeScanner.render(onScanSuccess, (err) => {});
    }

    async function onScanSuccess(decodedText) {
      html5QrcodeScanner.pause();
      const resultCard = document.getElementById('scan-result');
      resultCard.classList.remove('hidden', 'bg-green', 'bg-red');
      document.getElementById('btn-confirm-entry').classList.add('hidden');
      document.getElementById('r-decision').innerText = "VERIFYING...";
      currentScannedID = decodedText;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=get_single&id=${decodedText}`);
        const data = await res.json();

        if (data.error) {
          showScanResult("DENIED", "Invalid QR Code", "bg-red");
          return;
        }

        document.getElementById('r-name').innerText = data.VisitorName;
        document.getElementById('r-type').innerText = data.Type;
        document.getElementById('r-location').innerText = data.Location;

        // Validation Logic
        const today = new Date().setHours(0,0,0,0);
        const start = new Date(data.StartDate).setHours(0,0,0,0);
        const end = new Date(data.EndDate).setHours(0,0,0,0);

        if (data.Status !== 'Approved') {
            showScanResult("DENIED", "Pass not approved by Admin", "bg-red");
        } else if (data.Location !== currentUser.location) {
            showScanResult("DENIED", `Wrong Facility (Pass is for ${data.Location})`, "bg-red");
        } else if (data.Type === 'Visitor' && start !== today) {
            showScanResult("DENIED", "Pass is not valid for today", "bg-red");
        } else if (data.Type === 'Contractor' && (today < start || today > end)) {
            showScanResult("DENIED", "Contractor Pass Expired", "bg-red");
        } else {
            // All checks passed!
            showScanResult("ALLOWED", "Pass Validated", "bg-green");
            document.getElementById('btn-confirm-entry').classList.remove('hidden');
        }
      } catch (err) {
        showScanResult("ERROR", "Network failure", "bg-red");
      }
    }

    function showScanResult(decision, reason, colorClass) {
        document.getElementById('r-decision').innerText = decision;
        document.getElementById('r-reason').innerText = reason;
        document.getElementById('scan-result').classList.add(colorClass);
        if(decision !== "ALLOWED") {
            setTimeout(() => {
                document.getElementById('scan-result').classList.add('hidden');
                html5QrcodeScanner.resume();
            }, 3000);
        }
    }

    async function confirmEntry() {
      document.getElementById('btn-confirm-entry').innerText = "SAVING...";
      try {
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'check_in', id: currentScannedID }) });
        document.getElementById('scan-result').classList.add('hidden');
        document.getElementById('btn-confirm-entry').innerText = "CONFIRM ENTRY";
        html5QrcodeScanner.resume();
      } catch (err) { alert("Failed to log entry"); }
    }
  </script>
</body>
</html>
