<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noon SLP - Visitor System</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <!-- QR Code Generator & Scanner Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #12151c;
      --border-color: #242b3b;
      --noon-yellow: #ffc700;
      --text-main: #f0f2f5;
      --text-muted: #8b95a5;
      --input-bg: #090b10;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
    
    /* Utility Classes */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mb-4 { margin-bottom: 16px; }
    .mt-4 { margin-top: 16px; }

    /* Login Container (Matches your screenshots) */
    .login-container { width: 100%; max-width: 420px; background-color: var(--card-bg); padding: 40px 30px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    /* Logo Placeholder */
    .logo-box { width: 120px; height: 140px; margin: 0 auto 30px; background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Noon_logo_black_english.svg/512px-Noon_logo_black_english.svg.png') no-repeat center; background-size: contain; background-color: var(--noon-yellow); border-radius: 12px; padding: 10px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--noon-yellow); }
    
    /* Role Selector */
    .role-tabs { display: flex; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; margin-bottom: 24px; }
    .role-tab { flex: 1; padding: 12px 0; text-align: center; font-size: 12px; font-weight: 700; color: var(--text-muted); background: var(--bg-dark); cursor: pointer; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .role-tab:last-child { border-right: none; }
    .role-tab.active { background: var(--noon-yellow); color: #000; }
    
    /* Inputs & Buttons */
    .input-group { margin-bottom: 16px; }
    .input-field { width: 100%; padding: 14px; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; color: white; outline: none; }
    .input-field:focus { border-color: var(--noon-yellow); }
    .btn-primary { width: 100%; padding: 14px; background-color: var(--noon-yellow); color: #000; font-weight: 700; font-size: 14px; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-outline { background: transparent; color: var(--noon-yellow); border: 1px solid var(--noon-yellow); }
    
    /* Dashboards (Admin & Visitor) */
    .dashboard { width: 100%; max-width: 800px; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
    .header h2 { color: var(--noon-yellow); }
    
    /* Tables */
    table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    th { background: var(--bg-dark); color: var(--text-muted); text-transform: uppercase; font-size: 12px; }
    .action-btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-approve { background: var(--success); color: white; }
    .btn-reject { background: var(--danger); color: white; }

    /* QR Code Display & Scanner */
    #qr-container { background: white; padding: 20px; border-radius: 8px; display: inline-block; margin: 20px 0; }
    #reader { width: 100%; border: 2px solid var(--border-color); border-radius: 8px; overflow: hidden; background: #000; }
    .scan-result-card { background: var(--card-bg); padding: 20px; border-radius: 8px; text-align: center; margin-top: 20px; border: 2px solid transparent; }
    .status-approved { border-color: var(--success); }
    .status-rejected { border-color: var(--danger); }
  </style>
</head>
<body>

  <!-- ================= LOGIN SCREEN ================= -->
  <div id="login-view" class="login-container">
    <div class="logo-box"></div>
    
    <div class="role-tabs">
      <div class="role-tab" id="tab-guard" onclick="switchRole('guard')">🛡️ GUARD</div>
      <div class="role-tab active" id="tab-ops" onclick="switchRole('ops')">📋 VISITOR / OPS</div>
      <div class="role-tab" id="tab-admin" onclick="switchRole('admin')">⚙️ ADMIN</div>
    </div>

    <!-- Visitor / Ops Login Form -->
    <div id="form-ops">
      <div class="input-group"><input type="text" id="v-name" class="input-field" placeholder="Full Name"></div>
      <div class="input-group">
        <select id="v-type" class="input-field">
          <option value="Visitor">Visitor</option>
          <option value="Contractor">Contractor</option>
        </select>
      </div>
      <div class="input-group"><input type="text" id="v-company" class="input-field" placeholder="Company Name"></div>
      <div class="input-group"><input type="tel" id="v-phone" class="input-field" placeholder="Phone Number"></div>
      <button class="btn-primary" onclick="submitVisitorRequest()">Request Access</button>
      
      <div class="mt-4 text-center">
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">Already applied?</p>
        <div class="input-group">
            <input type="text" id="check-id" class="input-field" placeholder="Enter NOON-XXXXXX ID to check status">
        </div>
        <button class="btn-primary btn-outline" onclick="checkVisitorStatus()">Check Status / Get QR</button>
      </div>
    </div>

    <!-- Admin Login Form -->
    <div id="form-admin" class="hidden">
      <div class="input-group"><input type="password" id="a-pass" class="input-field" placeholder="Enter Admin Password"></div>
      <button class="btn-primary" onclick="adminLogin()">AUTHORIZE ACCESS</button>
    </div>

    <!-- Guard Login Form -->
    <div id="form-guard" class="hidden">
      <p class="text-center mb-4" style="color: var(--text-muted); font-size: 14px;">Log in to access scanner</p>
      <button class="btn-primary" onclick="openGuardScanner()">OPEN SCANNER</button>
    </div>
  </div>

  <!-- ================= VISITOR DASHBOARD (Shows QR) ================= -->
  <div id="visitor-view" class="dashboard hidden text-center">
    <div class="header">
      <h2>Visitor Access Portal</h2>
      <button class="btn-primary btn-outline" style="width: auto; padding: 6px 12px;" onclick="logout()">Back</button>
    </div>
    <div id="visitor-status-area">
      <h3 id="v-status-msg">Loading...</h3>
      <div id="qr-container" class="hidden"></div>
      <p id="v-id-display" style="font-size: 18px; font-weight: bold; margin-top: 10px; color: var(--noon-yellow);"></p>
    </div>
  </div>

  <!-- ================= ADMIN DASHBOARD ================= -->
  <div id="admin-view" class="dashboard hidden">
    <div class="header">
      <h2>Admin Control Center</h2>
      <button class="btn-primary btn-outline" style="width: auto; padding: 6px 12px;" onclick="logout()">Sign Out</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>ID</th>
          <th>Name</th>
          <th>Company</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="admin-table-body">
        <tr><td colspan="6" class="text-center">Loading requests...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- ================= GUARD SCANNER DASHBOARD ================= -->
  <div id="guard-view" class="dashboard hidden text-center">
    <div class="header">
      <h2>Security Checkpoint</h2>
      <button class="btn-primary btn-outline" style="width: auto; padding: 6px 12px;" onclick="stopScanner()">Exit Scanner</button>
    </div>
    
    <div style="max-width: 400px; margin: 0 auto;">
      <div id="reader"></div>
      
      <div id="scan-result" class="scan-result-card hidden">
        <h2 id="r-status" style="margin-bottom: 10px;">-</h2>
        <p><strong>Name:</strong> <span id="r-name">-</span></p>
        <p><strong>Type:</strong> <span id="r-type">-</span></p>
        <p><strong>Company:</strong> <span id="r-company">-</span></p>
      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    // ⚠️ REPLACE THIS WITH YOUR NEW GOOGLE APPS SCRIPT URL ⚠️
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzFQCv1Ng_n-U13NiMLz1Z2ldPzore4YBlnc6Iu4w5kkOSzaoNkPz80QlbD7PDOwld1_A/exec';
    
    let html5QrcodeScanner = null;

    // --- UI Routing (Switching views) ---
    function switchRole(role) {
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('#form-ops, #form-admin, #form-guard').forEach(f => f.classList.add('hidden'));
      
      document.getElementById(`tab-${role}`).classList.add('active');
      document.getElementById(`form-${role}`).classList.remove('hidden');
    }

    function showView(viewId) {
      document.querySelectorAll('.login-container, .dashboard').forEach(el => el.classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden');
    }

    function logout() { showView('login-view'); }

    // --- Visitor Logic ---
    async function submitVisitorRequest() {
      const payload = {
        action: 'create',
        name: document.getElementById('v-name').value,
        type: document.getElementById('v-type').value,
        company: document.getElementById('v-company').value,
        phone: document.getElementById('v-phone').value
      };
      
      if(!payload.name) return alert("Name is required");

      const btn = document.querySelector('#form-ops .btn-primary');
      btn.innerText = 'Submitting...';
      
      try {
        const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        const data = await res.json();
        
        alert(`Request submitted successfully! Your ID is ${data.id}. Please save this ID to check your status later.`);
        document.getElementById('check-id').value = data.id; // auto fill it
        btn.innerText = 'Request Access';
      } catch (err) {
        alert("Error submitting request.");
        btn.innerText = 'Request Access';
      }
    }

    async function checkVisitorStatus() {
      const id = document.getElementById('check-id').value.trim();
      if(!id) return alert("Please enter your NOON-XXXXXX ID");

      showView('visitor-view');
      document.getElementById('v-status-msg').innerText = "Checking status...";
      document.getElementById('qr-container').classList.add('hidden');
      document.getElementById('qr-container').innerHTML = ''; // clear old QR

      try {
        const res = await fetch(`${SCRIPT_URL}?action=get_single&id=${id}`);
        const data = await res.json();
        
        if (data.error) {
          document.getElementById('v-status-msg').innerText = "ID not found.";
          return;
        }

        if (data.Status === 'Approved') {
          document.getElementById('v-status-msg').innerText = `Status: APPROVED ✅`;
          document.getElementById('v-status-msg').style.color = 'var(--success)';
          document.getElementById('v-id-display').innerText = data.UniqueID;
          document.getElementById('qr-container').classList.remove('hidden');
          
          // Generate QR Code
          new QRCode(document.getElementById("qr-container"), {
            text: data.UniqueID,
            width: 200,
            height: 200,
            colorDark : "#000000",
            colorLight : "#ffffff"
          });
        } else if (data.Status === 'Rejected') {
          document.getElementById('v-status-msg').innerText = `Status: REJECTED ❌`;
          document.getElementById('v-status-msg').style.color = 'var(--danger)';
        } else {
          document.getElementById('v-status-msg').innerText = `Status: PENDING ⏳\n(Waiting for Admin Approval)`;
          document.getElementById('v-status-msg').style.color = 'var(--noon-yellow)';
        }
      } catch (err) {
        document.getElementById('v-status-msg').innerText = "Error loading status.";
      }
    }

    // --- Admin Logic ---
    function adminLogin() {
      const pass = document.getElementById('a-pass').value;
      if(pass === 'admin123') { // Simple frontend password for demo purposes
        showView('admin-view');
        loadAdminData();
      } else {
        alert("Incorrect Admin Password");
      }
    }

    async function loadAdminData() {
      const tbody = document.getElementById('admin-table-body');
      tbody.innerHTML = '<tr><td colspan="6" class="text-center">Loading...</td></tr>';
      
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        tbody.innerHTML = '';
        
        data.reverse().forEach(row => {
          if(!row.UniqueID) return; // Skip empty rows
          
          const tr = document.createElement('tr');
          const isPending = row.Status === 'Pending';
          
          let actionBtns = isPending ? `
            <button class="action-btn btn-approve" onclick="updateStatus('${row.UniqueID}', 'Approved')">Approve</button>
            <button class="action-btn btn-reject" onclick="updateStatus('${row.UniqueID}', 'Rejected')">Reject</button>
          ` : `<span>${row.Status}</span>`;

          tr.innerHTML = `
            <td>${new Date(row.Timestamp).toLocaleDateString()}</td>
            <td><strong>${row.UniqueID}</strong></td>
            <td>${row.Name}</td>
            <td>${row.Company}</td>
            <td style="color: ${row.Status==='Approved'?'var(--success)': row.Status==='Rejected'?'var(--danger)':'var(--noon-yellow)'}">${row.Status}</td>
            <td>${actionBtns}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">Failed to load data</td></tr>';
      }
    }

    async function updateStatus(id, newStatus) {
      if(!confirm(`Are you sure you want to mark ${id} as ${newStatus}?`)) return;
      
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'update_status', id: id, newStatus: newStatus })
        });
        loadAdminData(); // Refresh table
      } catch (err) {
        alert("Failed to update status");
      }
    }

    // --- Guard Scanner Logic ---
    function openGuardScanner() {
      showView('guard-view');
      document.getElementById('scan-result').classList.add('hidden');
      
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      html5QrcodeScanner.render(onScanSuccess, onScanError);
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear();
      }
      logout();
    }

    async function onScanSuccess(decodedText, decodedResult) {
      // Pause scanner while checking
      html5QrcodeScanner.pause();
      const resultCard = document.getElementById('scan-result');
      
      resultCard.classList.remove('hidden', 'status-approved', 'status-rejected');
      document.getElementById('r-status').innerText = "Verifying...";
      document.getElementById('r-status').style.color = 'var(--text-main)';

      try {
        const res = await fetch(`${SCRIPT_URL}?action=get_single&id=${decodedText}`);
        const data = await res.json();

        if (data.error) {
          document.getElementById('r-status').innerText = "INVALID QR (NOT FOUND)";
          resultCard.classList.add('status-rejected');
        } else {
          document.getElementById('r-name').innerText = data.Name;
          document.getElementById('r-type').innerText = data.Type;
          document.getElementById('r-company').innerText = data.Company;

          if (data.Status === 'Approved') {
            document.getElementById('r-status').innerText = "ACCESS GRANTED";
            document.getElementById('r-status').style.color = 'var(--success)';
            resultCard.classList.add('status-approved');
          } else {
            document.getElementById('r-status').innerText = "ACCESS DENIED (" + data.Status + ")";
            document.getElementById('r-status').style.color = 'var(--danger)';
            resultCard.classList.add('status-rejected');
          }
        }
      } catch (err) {
        document.getElementById('r-status').innerText = "NETWORK ERROR";
      }

      // Resume scanner after 4 seconds
      setTimeout(() => {
        resultCard.classList.add('hidden');
        html5QrcodeScanner.resume();
      }, 4000);
    }

    function onScanError(errorMessage) {
      // Ignored: fires continuously while looking for a QR
    }
  </script>
</body>
</html>
