<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor & Contractor Management System</title>
  <!-- Google Font (Inter / Sans-serif) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    /* Global Resets & Theme Variables */
    :root {
      --bg-dark: #0b0e14;
      --sidebar-bg: #12161f;
      --card-bg: #181d28;
      --border-color: #242b3b;
      --accent-yellow: #ffc700;
      --accent-yellow-hover: #e0af00;
      --text-main: #f0f2f5;
      --text-muted: #8b95a5;
      --input-bg: #0f131a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .brand {
      margin-bottom: 32px;
      padding: 0 8px;
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-yellow);
      letter-spacing: 0.5px;
    }

    .brand p {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .nav-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      padding: 12px 16px;
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .nav-item.active {
      background-color: rgba(255, 199, 0, 0.12);
      color: var(--accent-yellow);
      font-weight: 600;
    }

    .nav-item:hover:not(.active) {
      background-color: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }

    /* Main Content Layout */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
    }

    .top-header {
      padding: 24px 32px 12px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title h2 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-title p {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 4px;
    }

    .content-grid {
      padding: 20px 32px 32px 32px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
    }

    /* Cards */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 20px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent-yellow);
    }

    select.form-control {
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-yellow);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background-color: var(--accent-yellow-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Table Styles */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 14px 16px;
      font-size: 13px;
      border-bottom: 1px solid rgba(36, 43, 59, 0.5);
      color: var(--text-main);
    }

    tr:hover td {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-visitor {
      background-color: rgba(255, 199, 0, 0.15);
      color: var(--accent-yellow);
    }

    .badge-contractor {
      background-color: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
      .sidebar {
        width: 80px;
        padding: 16px 8px;
      }
      .brand p, .nav-item span {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="brand">
      <h1>NOON SLP</h1>
      <p>Visitor System</p>
    </div>
    <ul class="nav-menu">
      <li class="nav-item active">
        <span>📊 Registration Hub</span>
      </li>
      <li class="nav-item">
        <span>📋 History Log</span>
      </li>
      <li class="nav-item">
        <span>⚙️ System Config</span>
      </li>
    </ul>
  </aside>

  <!-- Main Workspace -->
  <main class="main-container">
    
    <header class="top-header">
      <div class="header-title">
        <h2>Visitor & Contractor Management</h2>
        <p>Real-Time Entry & Access Portal</p>
      </div>
    </header>

    <div class="content-grid">
      
      <!-- Entry Form Card -->
      <div class="card">
        <div class="card-title">New Entry Registration</div>
        
        <form id="entryForm">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="John Doe" required />
          </div>

          <div class="form-group">
            <label for="type">Category</label>
            <select id="type" class="form-control" required>
              <option value="">Select Role</option>
              <option value="Visitor">Visitor</option>
              <option value="Contractor">Contractor</option>
            </select>
          </div>

          <div class="form-group">
            <label for="company">Company / Organization</label>
            <input type="text" id="company" class="form-control" placeholder="Company Name" required />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="+966 5X XXX XXXX" required />
          </div>

          <button type="submit" id="submitBtn" class="btn-submit">REGISTER ENTRY</button>
        </form>
      </div>

      <!-- Data Table Card -->
      <div class="card">
        <div class="card-title">Active Records</div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date / Time</th>
                <th>Name</th>
                <th>Type</th>
                <th>Company</th>
                <th>Phone</th>
              </tr>
            </thead>
            <tbody id="dataTable">
              <tr>
                <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 24px;">Loading records...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script>
    // Paste your deployed Google Apps Script URL here
    const SCRIPT_URL = 'YOUR_APPS_SCRIPT_WEB_APP_URL';

    // 1. Fetch records from Google Sheet and update table
    async function loadData() {
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        const tbody = document.getElementById('dataTable');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 24px;">No entries logged yet.</td></tr>';
          return;
        }

        // Render rows in reverse order (newest first)
        data.reverse().forEach(row => {
          const tr = document.createElement('tr');
          
          const formattedDate = row.Timestamp ? new Date(row.Timestamp).toLocaleString() : '-';
          const typeBadge = row.Type === 'Contractor' 
            ? `<span class="badge badge-contractor">Contractor</span>`
            : `<span class="badge badge-visitor">Visitor</span>`;

          tr.innerHTML = `
            <td>${formattedDate}</td>
            <td style="font-weight: 600;">${row.Name || '-'}</td>
            <td>${typeBadge}</td>
            <td>${row.Company || '-'}</td>
            <td>${row.Phone || '-'}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Data Fetch Error:', err);
      }
    }

    // 2. Form Submission Handler
    document.getElementById('entryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'SAVING RECORD...';
      btn.disabled = true;

      const payload = {
        name: document.getElementById('name').value,
        type: document.getElementById('type').value,
        company: document.getElementById('company').value,
        phone: document.getElementById('phone').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        document.getElementById('entryForm').reset();
        
        setTimeout(() => {
          loadData();
          btn.innerText = 'REGISTER ENTRY';
          btn.disabled = false;
        }, 1500);

      } catch (err) {
        alert('Failed to register entry. Please try again.');
        btn.innerText = 'REGISTER ENTRY';
        btn.disabled = false;
      }
    });

    // Initial Data Fetch on Page Load
    loadData();
  </script>
</body>
</html>
